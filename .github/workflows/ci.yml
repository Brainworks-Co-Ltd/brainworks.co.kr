name: CI

on:
  push:
    branches: [main, feat/homepage-redesign]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: brainworks
          POSTGRES_PASSWORD: brainworks_ci
          POSTGRES_DB: brainworks_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U brainworks -d brainworks_ci"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      DATABASE_URL: postgresql://brainworks:brainworks_ci@localhost:5432/brainworks_ci
      DATABASE_TEST_URL: postgresql://brainworks:brainworks_ci@localhost:5432/brainworks_ci
      APP_ORIGIN: http://localhost:3000
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:db
      - run: npm run build
      - run: npm audit --audit-level=high

